# Host-wide monitoring, independent of watch_dir rules.
monitor_mode=host
observe_only=1
kill_on_detect=0
quarantine_dir=/var/log/sentinel/quarantine
log_file=/var/log/sentinel/sentinel.log
state_file=/var/lib/sentinel/state.db
heartbeat_file=/var/lib/sentinel/heartbeat
log_max_size=5242880
loop_interval=10
max_actions_per_cycle=50
